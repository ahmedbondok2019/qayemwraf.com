name: Deploy via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting Deployment..."
            cd ~/domains/egimedical.com/public_html/ || exit 1

            # 1. هوية السحب من جيت هب
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"

            # 2. تحديث الكود
            if [ ! -d ".git" ]; then
              git init
              git remote add origin git@github.com:egypt-vision/egimedical.com.git
            fi
            echo "Fetching latest changes..."
            git fetch origin main
            git reset --hard origin/main

            # 3. تثبيت المكتبات (تعديل جوهري هنا)
            echo "Installing dependencies..."
            export APP_ENV=production
            export APP_DEBUG=false

            # استخدام install مع تجاهل المتطلبات التقنية للسيرفر لضمان النجاح
            composer install --no-dev --optimize-autoloader --ignore-platform-reqs || {
              echo "Composer failed, trying with update as fallback..."
              composer update --no-dev --optimize-autoloader --ignore-platform-reqs
            }

            # 4. ملف الـ Admin (قبل الـ Optimize)
            ADMIN_FILE="vendor/laravel/framework/src/Illuminate/Foundation/Auth/Admin.php"
            if [ ! -f "$ADMIN_FILE" ]; then
              echo "Creating Admin.php patch..."
              mkdir -p "$(dirname "$ADMIN_FILE")"
              echo "" > "$ADMIN_FILE"
            fi
            # 5. تهيئة Laravel (أضفنا فحص للملف .env)
            echo "Optimizing Laravel..."
            if [ -f ".env" ]; then
              php artisan migrate --force || echo "Migration failed, check DB connection in .env"
              php artisan optimize:clear
              php artisan scribe:generate --force || echo "Scribe generation failed, skipping..."
            else
              echo "⚠️ .env file missing! Commands skipped. Please create it manually on Hostinger."
            fi

            # 6. إصلاح توافقية PHP 8.2
            TRANS_FILE="vendor/joedixon/laravel-translation/src/Drivers/Translation.php"
            if [ -f "$TRANS_FILE" ]; then
              sed -i "s/function (\$value, &\$key)/function (\$value, \$key)/g" "$TRANS_FILE"
            fi

            # 7. الصلاحيات
            chmod -R 775 storage bootstrap/cache

            echo "✅ Deployment completed successfully!"
            php artisan migrate:fresh --seed --force
